<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Disneyland Resort Dashboard</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body { overflow: hidden; font-family: Arial, Helvetica, sans-serif; }

		#dashboardFrame {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			border: none;
			z-index: 1;
		}

		.overlay {
			position: fixed;
			bottom: 5px;
			left: 5px;
			z-index: 2;
			background: rgba(15, 23, 42, 0.88);
			border: 1px solid rgba(255,255,255,0.14);
			border-radius: 14px;
			padding: 8px 14px;
			color: #e5e7eb;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			min-width: 380px;
			max-width: 440px;
		}

		.datetime {
			margin-top: 0;
			padding-top: 0;
			border-top: none;
		}
		.date-value { font-size: 0.78rem; color: #94a3b8; letter-spacing: 0.05em; text-transform: uppercase; }
		.time-value { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; line-height: 1.15; margin-top: 2px; }

		.weather {
			margin-top: 6px;
			padding-top: 6px;
			border-top: 1px solid rgba(255,255,255,0.1);
		}
		.weather-label { font-size: 0.72rem; color: #94a3b8; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
		.forecast-row { display: flex; gap: 6px; }
		.fc-day {
			flex: 1;
			background: rgba(255,255,255,0.06);
			border-radius: 8px;
			padding: 6px 4px;
			text-align: center;
		}
		.fc-name { font-size: 0.72rem; font-weight: 700; color: #cbd5e1; }
		.fc-icon { font-size: 1.1rem; line-height: 1.5; }
		.fc-temps { font-size: 0.7rem; font-weight: 600; margin-top: 1px; }
	</style>
</head>
<body>
	<iframe
		id="dashboardFrame"
		src="https://app.smartsheet.com/b/publish?EQBCT=bf89d82cf784445eaf0a2122ace52019"
		title="Smartsheet Dashboard"
		allowfullscreen
	></iframe>

	<aside class="overlay" aria-label="Date, time and weather">

		<div class="datetime" aria-live="polite">
			<div class="date-value" id="dateDisplay">Loading…</div>
			<div class="time-value" id="timeDisplay">--:--:-- --</div>
		</div>

		<div class="weather">
			<div class="weather-label" id="weatherLabel">Loading forecast…</div>
			<div class="forecast-row" id="forecastRow"></div>
		</div>
	</aside>

	<script>
		const dateDisplay = document.getElementById('dateDisplay');
		const timeDisplay = document.getElementById('timeDisplay');
		const forecastRow  = document.getElementById('forecastRow');
		const weatherLabel = document.getElementById('weatherLabel');

		const dateFormatter = new Intl.DateTimeFormat('en-US', {
			weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
		});
		const timeFormatter = new Intl.DateTimeFormat('en-US', {
			hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
		});

		dateDisplay.textContent = dateFormatter.format(new Date()).toUpperCase();
		function updateTime() { timeDisplay.textContent = timeFormatter.format(new Date()); }
		updateTime();
		setInterval(updateTime, 1000);

		const weatherCodeMap = {
			0: ['☀️', 'Clear'], 1: ['🌤️', 'Mainly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
			45: ['🌫️', 'Fog'], 48: ['🌫️', 'Rime fog'], 51: ['🌦️', 'Lt drizzle'], 53: ['🌦️', 'Drizzle'],
			55: ['🌧️', 'Drizzle'], 61: ['🌧️', 'Lt rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Hvy rain'],
			71: ['🌨️', 'Lt snow'], 73: ['🌨️', 'Snow'], 75: ['❄️', 'Hvy snow'], 80: ['🌦️', 'Showers'],
			81: ['🌧️', 'Showers'], 82: ['🌧️', 'Hvy showers'], 95: ['⛈️', 'Thunderstorm'],
			96: ['⛈️', 'T-storm+hail'], 99: ['⛈️', 'T-storm+hail']
		};

		// Append T12:00:00 to avoid UTC midnight shifting the day label
		function dayLabel(d) {
			return new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(new Date('T12:00:00' + d));
		}

		async function loadWeather() {
			try {
				const url = 'https://api.open-meteo.com/v1/forecast?latitude=33.8121&longitude=-117.9190&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=5';
				const res = await fetch(url);
				if (!res.ok) throw new Error();
				const data = await res.json();
				forecastRow.innerHTML = '';
				data.daily.time.forEach((date, i) => {
					const [icon] = weatherCodeMap[data.daily.weathercode[i]] || ['🌡️'];
					const cell = document.createElement('div');
					cell.className = 'fc-day';
					cell.innerHTML = `
						<div class="fc-name">${dayLabel(date)}</div>
						<div class="fc-icon">${icon}</div>
						<div class="fc-temps">${Math.round(data.daily.temperature_2m_max[i])}°/${Math.round(data.daily.temperature_2m_min[i])}°</div>
					`;
					forecastRow.appendChild(cell);
				});
				weatherLabel.textContent = '5-Day Forecast · Anaheim, CA';
			} catch {
				weatherLabel.textContent = 'Forecast unavailable';
			}
		}

		loadWeather();
	</script>
</body>
</html>
